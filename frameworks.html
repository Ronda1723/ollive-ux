<html lang="en">
<head>

  <style>
    .fwgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .fwcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; cursor: pointer; transition: border-color .15s; text-align: left; }
    .fwcard:hover { border-color: var(--faint); }
    .fwcard.on { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .fwcard b { font-size: 13px; font-weight: 600; display: block; }
    .fwcard .pct { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 10px; }
    .fwcard .split { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .fwcard .split .row { display: flex; align-items: center; gap: 8px; }
    .fwcard .split .row span:first-child { width: 38px; font-family: var(--mono); font-size: 10px; color: var(--faint); text-transform: uppercase; }
    .fwcard .split .bar { flex: 1; }
    .fwcard .cap { font-size: 11px; margin-top: 10px; color: var(--score-mid); }
    .lay { display: inline-flex; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 5px; }
    .lay.org { background: #EEF1F5; color: #40506B; }
    .lay.agt { background: var(--green-tint); color: var(--green-text); }
  </style>
</head>

let curFW = 'euai', curLayer = 'all';

function renderCards() {
  document.getElementById('fwgrid').innerHTML = Object.entries(FW).map(([k, f]) => `
    <button class="fwcard${k===curFW?' on':''}" onclick="setFW('${k}')">
      <b>${f.name}</b>
      <div class="pct" style="color:${f.pct>=80?'var(--score-high)':f.pct>=60?'var(--score-mid)':'var(--score-low)'}">${f.pct}%</div>
      <div class="split">
        <div class="row"><span>org</span><span class="bar"><i class="${f.org[0]/f.org[1]>=.8?'high':'mid'}" style="width:${Math.round(f.org[0]/f.org[1]*100)}%"></i></span><span class="mono" style="font-size:10px;color:var(--muted)">${f.org[0]}/${f.org[1]}</span></div>
        <div class="row"><span>agent</span><span class="bar"><i class="${f.agt[0]/f.agt[1]>=.8?'high':'mid'}" style="width:${Math.round(f.agt[0]/f.agt[1]*100)}%"></i></span><span class="mono" style="font-size:10px;color:var(--muted)">${f.agt[0]}/${f.agt[1]}</span></div>
      </div>
      <div class="cap">${f.cap}</div>
    </button>`).join('');
}
function setFW(k) { curFW = k; renderCards(); renderTable(); }
function setLayer(btn, l) {
  curLayer = l;
  document.querySelectorAll('#lay-seg button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderTable();
}
function renderTable() {
  const f = FW[curFW];
  document.getElementById('dir-title').textContent = f.name + ' — directives';
  document.getElementById('dir-note').textContent = f.note;
  document.getElementById('dir-foot').innerHTML = f.foot;
  const rows = f.dirs.filter(d =>
    curLayer === 'all' ? true :
    curLayer === 'open' ? OPEN.includes(d.status) :
    d.layer === curLayer);
  document.getElementById('dir-body').innerHTML = rows.map((d, i) => {
    const idx = f.dirs.indexOf(d);
    const [pc, pl] = ST[d.status];
    return `
    <tr class="rowlink" onclick="openDir('${curFW}',${idx})">
      <td><b style="font-weight:600">${d.name}</b><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px">${d.id} · ${d.src}</div></td>
      <td><span class="lay ${d.layer}">${d.layer.toUpperCase()}</span></td>
      <td style="font-size:12px;color:var(--ink-2)">${d.ver}</td>
      <td><span class="pill ${pc}${d.status==='failing'||d.status==='conflict'?' dot':''}">${pl}</span><div style="font-size:11px;color:var(--muted);margin-top:4px;max-width:230px">${d.meta}</div></td>
      <td class="right"><button class="btn ghost sm" onclick="event.stopPropagation();dirAct('${curFW}',${idx})">${d.act[0]}</button></td>
    </tr>`;}).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px">No directives match this filter</td></tr>';
}
function dirAct(fw, i) {
  const d = FW[fw].dirs[i];
  if (d.act[1] === '#') { openDir(fw, i); return; }
  if (d.act[0] === 'Re-request') { toast('Renewal request sent · due Aug 15'); return; }
  location.href = d.act[1];
}
function openDir(fw, i) {
  const d = FW[fw].dirs[i];
  const [pc, pl] = ST[d.status];
  let body = '';
  if (d.detail.ev) {
    const e = d.detail.ev;
    body += `<div class="d-sec"><div class="d-sec-h">Evidence</div><div class="d-sec-b">
      <div style="display:grid;grid-template-columns:110px 1fr;gap:8px 16px;font-size:12px">
        <span style="color:var(--muted)">Document</span><span class="mono" style="font-size:12px">${e.doc}</span>
        <span style="color:var(--muted)">Hash</span><span class="mono" style="font-size:12px">${e.hash}</span>
        <span style="color:var(--muted)">Reviewer</span><span>${e.reviewer}</span>
        <span style="color:var(--muted)">Reviewed</span><span>${e.date}</span>
        <span style="color:var(--muted)">Expires</span><span>${e.exp}</span>
      </div>
      ${e.rej ? `<div style="margin-top:12px;padding:10px 12px;background:var(--fail-bg);color:var(--fail-text);border-radius:8px;font-size:12px">${e.rej}</div>` : ''}
      ${d.detail.tier ? `<div style="margin-top:12px;font-size:12px;color:var(--ink-2)">${d.detail.tier}</div>` : ''}
    </div></div>`;
  }
  if (d.detail.test) {
    const t = d.detail.test;
    body += `<div class="d-sec"><div class="d-sec-h">Test results</div><div class="d-sec-b">
      <div style="display:grid;grid-template-columns:110px 1fr;gap:8px 16px;font-size:12px">
        <span style="color:var(--muted)">Test cases</span><span>${t.sc}</span>
        <span style="color:var(--muted)">Attempts</span><span>${t.att}</span>
        <span style="color:var(--muted)">Run</span><span class="mono" style="font-size:12px">${t.run}</span>
        ${t.issue ? `<span style="color:var(--muted)">Linked issue</span><span>${t.issue}</span>` : ''}
      </div>
      ${d.detail.stat ? `<div style="margin-top:12px;font-size:12px;color:var(--ink-2)">${d.detail.stat}</div>` : ''}
    </div></div>`;
  }
  if (d.detail.conflict) {
    body += `<div class="d-sec" style="border-color:var(--score-low)"><div class="d-sec-h">Cross-layer conflict · linked to ${d.detail.conflict.pair}</div>
      <div class="d-sec-b" style="font-size:12px">${d.detail.conflict.text}</div></div>`;
  }
  if (d.detail.link) {
    body += `<div class="d-sec"><div class="d-sec-h">Linked directive · ${d.detail.link.pair}</div>
      <div class="d-sec-b" style="font-size:12px">${d.detail.link.text}</div></div>`;
  }
  body += `<div class="d-sec"><div class="d-sec-h">History</div><div class="d-sec-b" style="padding:0">
    ${d.detail.hist.map(h => `<div style="padding:10px 16px;border-bottom:1px solid var(--border-soft);font-size:12px;color:var(--ink-2)">${h}</div>`).join('')}
  </div></div>`;
  const [label, href] = d.act;
  body += `<div style="margin-top:16px;display:flex;gap:10px">
    ${href !== '#' ? `<a class="btn primary sm" href="${href}">${label}</a>` : ''}
    <button class="btn ghost sm" onclick="toast('Directive ${d.id} added to the next report note')">Add note</button>
  </div>`;
  document.getElementById('d-body').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center"><span class="lay ${d.layer}">${d.layer.toUpperCase()}</span><span class="pill ${pc}">${pl}</span></div>
    <h2 style="font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:12px">${d.name}</h2>
    <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px">${d.id} · ${d.src} · ${FW[fw].name}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">Verified by: ${d.ver}</div>
    ${body}`;
  document.getElementById('d-drawer').classList.add('open');
  document.getElementById('d-scrim').classList.add('open');
}
function closeDir() {
  document.getElementById('d-drawer').classList.remove('open');
  document.getElementById('d-scrim').classList.remove('open');
}
let tt;
function toast(msg) {
  document.getElementById('toast-msg').textContent = msg;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDir(); });
renderCards(); renderTable();
</script>
</body>
</html>
